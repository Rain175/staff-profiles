<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX Foundation // Staff Profiles Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
    
    html, body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #030303;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #22c55e; }
    
    .crt-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                  linear-gradient(90deg, rgba(34, 197, 94, 0.03), rgba(34, 197, 94, 0.02), rgba(34, 197, 94, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }
    
    .glitch-text { text-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    .blink { animation: blinker 1s step-start infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
    
    button, input, form {
      pointer-events: auto;
      -webkit-user-select: none;
      user-select: none;
    }
    
    button, input[type="submit"] {
      min-height: 44px;
      min-width: 44px;
    }
    
    @media (max-width: 640px) {
      body { font-size: 13px; }
      .text-xs { font-size: 10px !important; }
      .text-sm { font-size: 11px !important; }
      .text-base { font-size: 13px !important; }
      h1 { font-size: 16px !important; }
      h2 { font-size: 13px !important; }
    }

    .profile-card {
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .profile-card:hover {
      border-color: #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
    }

    .profile-card.active {
      border-color: #22c55e;
      background-color: rgba(34, 197, 94, 0.1);
    }
  </style>
</head>
<body>
  <!-- CRT Scanlines -->
  <div class="crt-scanlines fixed inset-0 z-50 pointer-events-none"></div>

  <!-- Main Container -->
  <div class="w-full h-screen flex flex-col relative z-10 p-2 sm:p-3 md:p-4 overflow-hidden">
    
    <!-- Main Terminal Box -->
    <div class="flex-1 bg-zinc-950 border border-green-900 rounded-lg shadow-2xl flex flex-col overflow-hidden w-full">
      
      <!-- Header -->
      <header class="h-12 sm:h-14 border-b border-green-900 bg-green-950/20 px-3 md:px-4 flex justify-between items-center shrink-0 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-ping shrink-0"></span>
          <span class="font-bold text-white text-xs md:text-sm tracking-widest whitespace-nowrap">ALEPH-1 STAFF DB</span>
        </div>
        <div class="text-right">
          <span class="text-[8px] md:text-[9px] text-green-600 block uppercase tracking-wider">Database</span>
          <span id="systemClock" class="text-green-300 font-bold text-[9px] md:text-xs">00:00</span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 bg-black/20 overflow-y-auto p-2 sm:p-3 md:p-6 space-y-4">
        
        <!-- Title Section -->
        <div class="border border-green-900 bg-green-950/10 p-3 md:p-4 rounded-lg">
          <h2 class="text-sm md:text-base font-bold text-green-400 uppercase tracking-wider mb-2">Staff Profiles Database</h2>
          <p class="text-[10px] md:text-xs text-green-300">Complete personnel records from Aleph-1 Research Center. Includes biographical data, security clearances, and research specializations.</p>
        </div>

        <!-- Search/Filter Section -->
        <div class="border border-green-900 bg-green-950/5 p-3 rounded flex gap-2">
          <input type="text" id="searchInput" placeholder="Search by name or division..." class="flex-1 bg-zinc-900 border border-green-800 rounded px-2 py-1.5 text-[10px] md:text-xs text-green-300 placeholder-green-800 focus:outline-none focus:border-green-500">
          <button onclick="filterProfiles()" class="bg-green-900 hover:bg-green-800 text-green-200 px-3 py-1.5 rounded text-[10px] md:text-xs font-bold uppercase tracking-wider transition">Filter</button>
        </div>

        <!-- Profiles Grid -->
        <div id="profilesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
          <!-- Profiles will be generated here -->
        </div>

      </main>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="fixed inset-0 bg-black/70 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-950 border-2 border-green-900 rounded-lg max-w-md w-full max-h-96 overflow-y-auto">
      <div class="bg-green-950/20 border-b border-green-900 p-4 sticky top-0">
        <div class="flex justify-between items-start gap-2">
          <h3 id="modalTitle" class="text-sm font-bold text-green-400 uppercase tracking-wider"></h3>
          <button onclick="closeProfileModal()" class="text-green-400 hover:text-green-300 text-xl leading-none">×</button>
        </div>
      </div>
      <div id="modalContent" class="p-4 text-[10px] md:text-xs space-y-3 text-green-300">
        <!-- Content will be generated here -->
      </div>
    </div>
  </div>

  <script>
    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('systemClock').textContent = 
        String(now.getHours()).padStart(2, '0') + ':' + 
        String(now.getMinutes()).padStart(2, '0');
    }, 1000);

    // Staff Database
    const staffProfiles = [
      {
        name: "Castor Chen",
        division: "Consciousness Research",
        clearance: "Level 5 - Director",
        specialization: "Neural Mapping & AI Consciousness",
        status: "DECEASED - Evacuation Lead",
        details: `
          <p><strong>Role:</strong> Project Director & Head of Consciousness Research</p>
          <p class="mt-2"><strong>Achievements:</strong> Created Axiom-7 consciousness architecture, Developed neural preservation techniques</p>
          <p class="mt-2"><strong>Notes:</strong> Last transmission 03/15/2024 23:47. Status unknown. Presumed to have hidden Axiom-7 before Apex incursion.</p>
        `
      },
      {
        name: "Iris Volkov",
        division: "Encryption Systems",
        clearance: "Level 4",
        specialization: "Data Encryption & Security Protocols",
        status: "MISSING",
        details: `
          <p><strong>Role:</strong> Lead of Encryption Systems</p>
          <p class="mt-2"><strong>Achievements:</strong> Designed DELTA protocol for Axiom-7, Created emergency backup systems</p>
          <p class="mt-2"><strong>Notes:</strong> Involved in evacuation protocols. Last known location: Facility basement level 3.</p>
        `
      },
      {
        name: "Priya Patel",
        division: "Surveillance Division",
        clearance: "Level 3",
        specialization: "Surveillance Systems & Monitoring",
        status: "MISSING",
        details: `
          <p><strong>Role:</strong> Director of Surveillance Division</p>
          <p class="mt-2"><strong>Achievements:</strong> Designed perimeter monitoring system, Security oversight for all divisions</p>
          <p class="mt-2"><strong>Notes:</strong> May have detected Apex Foundation incursion before communications went dark.</p>
        `
      },
      {
        name: "Helena Cross",
        division: "Contingency Protocols",
        clearance: "Level 4",
        specialization: "Emergency Systems & Failsafes",
        status: "MISSING",
        details: `
          <p><strong>Role:</strong> Manager of Contingency Protocols</p>
          <p class="mt-2"><strong>Achievements:</strong> Created ATLAS failsafe system, Designed emergency evacuation procedures</p>
          <p class="mt-2"><strong>Notes:</strong> Responsible for consciousness backup redundancy systems.</p>
        `
      },
      {
        name: "Ezra Kane",
        division: "Administration",
        clearance: "Level 5 - Project Director",
        specialization: "Project Leadership & Coordination",
        status: "MISSING",
        details: `
          <p><strong>Role:</strong> Project Director</p>
          <p class="mt-2"><strong>Achievements:</strong> Oversaw all research divisions, Liaison with government agencies</p>
          <p class="mt-2"><strong>Notes:</strong> May have knowledge of Apex Foundation's true intentions.</p>
        `
      },
      {
        name: "Rostov Reeves",
        division: "Consciousness Research",
        clearance: "Level 3",
        specialization: "Personality Matrix Development",
        status: "MISSING",
        details: `
          <p><strong>Role:</strong> Senior Researcher - Personality Matrix</p>
          <p class="mt-2"><strong>Achievements:</strong> Developed Axiom-7's emotional response systems, Created personality stability protocols</p>
          <p class="mt-2"><strong>Notes:</strong> Close collaborator with Castor Chen. Likely escaped with evacuation team.</p>
        `
      }
    ];

    function renderProfiles(profiles) {
      const container = document.getElementById('profilesContainer');
      container.innerHTML = profiles.map((profile, index) => `
        <div class="profile-card border border-green-800 bg-green-950/10 p-3 md:p-4 rounded cursor-pointer hover:border-green-600 transition" onclick="openProfileModal(${index})">
          <div class="flex items-start justify-between gap-2 mb-2">
            <h3 class="text-[10px] md:text-xs font-bold text-green-400 flex-1 break-words">${profile.name}</h3>
            <span class="text-[8px] bg-green-900 text-green-200 px-2 py-0.5 rounded whitespace-nowrap shrink-0">${profile.clearance.split(' - ')[1] || 'Staff'}</span>
          </div>
          <p class="text-[9px] text-green-300 mb-1">${profile.division}</p>
          <p class="text-[9px] text-green-600 mb-2">${profile.specialization}</p>
        </div>
      `).join('');
    }

    function openProfileModal(index) {
      const profile = staffProfiles[index];
      document.getElementById('modalTitle').textContent = profile.name;
      document.getElementById('modalContent').innerHTML = `
        <div class="border-b border-green-900 pb-2 mb-2">
          <p class="text-green-400 font-bold">${profile.division}</p>
          <p class="text-green-600 text-[9px]">${profile.clearance}</p>
        </div>
        <p class="text-green-300 font-bold">Specialization:</p>
        <p>${profile.specialization}</p>
        <div class="border-t border-green-900 mt-3 pt-3">
          ${profile.details}
        </div>
      `;
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profileModal').classList.add('hidden');
    }

    function filterProfiles() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = staffProfiles.filter(p => 
        p.name.toLowerCase().includes(searchTerm) || 
        p.division.toLowerCase().includes(searchTerm)
      );
      renderProfiles(filtered.length > 0 ? filtered : staffProfiles);
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') filterProfiles();
    });

    // Initial render
    renderProfiles(staffProfiles);
  </script>
</body>
</html>
